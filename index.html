<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DeepMusic</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #2b1b3d, #0f0f14 60%);
    color: #eae6f2; padding: 24px;
  }
  .card {
    width: min(560px, 100%); background: #17151d; border: 1px solid #2c2838;
    border-radius: 24px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .logo {
    width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
    background: linear-gradient(135deg, #a970ff, #6a3bd6); font-size: 36px; margin-bottom: 18px;
  }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.5px; }
  .sub { margin: 0 0 22px; color: #a49bb8; }
  .version { color: #c9b6ff; font-weight: 600; }
  .notes {
    background: #1f1c28; border: 1px solid #2c2838; border-radius: 14px;
    padding: 14px 16px; margin: 0 0 22px; line-height: 1.5; color: #d8d3e4;
    white-space: pre-wrap;
  }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 700;
    background: linear-gradient(135deg, #a970ff, #7c3aed); color: #fff;
    padding: 16px; border-radius: 14px; font-size: 17px;
  }
  .btn:active { transform: scale(.99); }
  .hint { margin-top: 16px; color: #8e86a3; font-size: 13px; line-height: 1.6; }
  .hint code { color: #b8afc9; word-break: break-all; }
  .meta { margin-top: 18px; color: #8e86a3; font-size: 13px; line-height: 1.6; word-break: break-all; }
  .meta code { color: #b8afc9; }
  .status { color: #ff8a9a; font-size: 13px; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">🎵</div>
    <h1>DeepMusic</h1>
    <p class="sub">Música sem anúncio, com favoritas offline.</p>
    <p class="sub">Versão <span class="version" id="version">…</span></p>
    <p class="notes" id="notes">Carregando…</p>
    <a class="btn" id="download" href="#" aria-disabled="true">Baixar APK</a>
    <p class="hint">
      Para atualizar pelo próprio app: Configurações → “URL do update.json” →
      cole <code id="update-url"></code> e toque em “Verificar agora”.
    </p>
    <p class="meta" id="stats" style="display:none"></p>
    <div id="history" style="margin-top:6px"></div>
    <p class="meta">
      Arquivo: <code id="apk"></code><br>
      SHA-256: <code id="sha"></code><br>
      Build: <span id="when"></span>
    </p>
    <p class="status" id="status"></p>
  </main>
  <script>
    const updateUrl = location.origin + "/api/update";
    document.getElementById("update-url").textContent = updateUrl;

    function human(bytes) {
      if (!bytes) return "—";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    fetch(updateUrl)
      .then((r) => r.json())
      .then((data) => {
        document.getElementById("version").textContent = data.versionName || "—";
        document.getElementById("notes").textContent =
          (data.notes || "Sem notas para esta versão.").trim();
        document.getElementById("sha").textContent = data.sha256 || "—";
        document.getElementById("when").textContent = data.builtAt
          ? new Date(data.builtAt).toLocaleString("pt-BR")
          : "—";
        document.getElementById("apk").textContent = data.apkUrl || "—";

        const button = document.getElementById("download");
        if (data.apkUrl) {
          button.href = data.apkUrl;
          button.textContent = "Baixar APK (" + human(data.size) + ")";
          button.removeAttribute("aria-disabled");
        } else {
          button.textContent = "APK indisponível";
        }
      })
      .catch(() => {
        document.getElementById("notes").textContent = "Não foi possível carregar a versão.";
        document.getElementById("status").textContent = "Tente novamente em instantes.";
      });

    fetch(location.origin + "/api/stats")
      .then((r) => r.json())
      .then((data) => {
        if (!data || !Array.isArray(data.releases)) return;
        const stats = document.getElementById("stats");
        stats.style.display = "block";
        stats.innerHTML =
          "<strong>" + data.total + "</strong> download(s) no total · " +
          data.releases.length + " versão(ões) publicada(s)";

        const history = document.getElementById("history");
        history.innerHTML =
          '<p class="meta" style="margin-top:6px">' +
          data.releases
            .slice(0, 5)
            .map((r) => r.tag + " — " + r.downloads + " download(s)")
            .join("<br>") +
          "</p>";
      })
      .catch(() => {});
  </script>
</body>
</html>
